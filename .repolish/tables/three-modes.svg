<svg xmlns="http://www.w3.org/2000/svg" width="880" height="239" viewBox="0 0 880 239" lang="en" role="img" aria-label="Three modes — table">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d56f4"/>
      <stop offset="0.55" stop-color="#ff5fd1"/>
      <stop offset="1" stop-color="#43e5d0"/>
    </linearGradient>
  </defs>
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "Noto Sans Mono CJK SC", "Noto Sans Mono CJK JP", "Microsoft YaHei", "Hiragino Sans", "Yu Gothic", monospace; }
  </style>
  <rect x="0" y="0" width="880" height="239" rx="18.0" fill="#1a1a24"/>
  <rect x="0.5" y="0.5" width="879" height="238" rx="17.5" fill="none" stroke="#35334a"/>
  <text class="t" x="28" y="38" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">THREE MODES</text>
  <text class="t" x="28" y="68" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">MODE</text>
  <text class="t" x="126" y="68" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">WHAT IT DOES</text>
  <rect x="28" y="78" width="824" height="1" fill="#35334a"/>
  <rect x="28" y="89" width="48" height="19" rx="4.0" fill="#222130"/>
  <text class="t" x="34" y="102" font-size="12" fill="#edebfa" text-anchor="start">audit</text>
  <text class="t" x="126" y="102" font-size="13" fill="#edebfa" text-anchor="start">never blocks. Findings are still produced and logged — this is how you learn what enforcing</text>
  <text class="t" x="126" y="120" font-size="13" fill="#edebfa" text-anchor="start">would cost before you enforce.</text>
  <rect x="20" y="131" width="840" height="35" rx="5.0" fill="#222130"/>
  <rect x="28" y="142" width="70" height="19" rx="4.0" fill="#222130"/>
  <text class="t" x="34" y="155" font-size="12" fill="#edebfa" text-anchor="start">balanced</text>
  <text class="t" x="126" y="155" font-size="13" fill="#edebfa" text-anchor="start">blocks critical findings, warns on the rest. The default.</text>
  <rect x="28" y="177" width="55" height="19" rx="4.0" fill="#222130"/>
  <text class="t" x="34" y="190" font-size="12" fill="#edebfa" text-anchor="start">strict</text>
  <text class="t" x="126" y="190" font-size="13" fill="#edebfa" text-anchor="start">blocks anything high or worse, and refuses any destination not on the allowlist.</text>
  <rect x="28" y="201" width="824" height="1" fill="#35334a"/>
</svg>
